# Pasa todas las pruebas de Rumbo en Windows y en Linux cada vez que cambia el código.
# Si alguna falla, GitHub lo marca en rojo y no se publica la imagen de Docker.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar lo que necesita Rumbo
        run: python -m pip install -r requirements.txt
      - name: Pruebas (sin internet, nunca tocan datos reales)
        run: python -m unittest discover -s tests -b
