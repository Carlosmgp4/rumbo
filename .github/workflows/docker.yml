# Imagen oficial de Rumbo en Docker (ghcr.io), para PC/servidores (amd64) y Raspberry Pi (arm64).
# Se publica sola al crear una versión (etiqueta v2.0.0, v2.1.0...), con las etiquetas
# 2.0.0, 2.0 y latest. Antes: pasan las pruebas y se arranca la imagen para comprobar que funciona.
name: Imagen de Docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  pruebas:
    uses: ./.github/workflows/pruebas.yml

  imagen:
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Construir una imagen de prueba
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rumbo:prueba

      - name: Arrancarla y comprobar que funciona y que es segura
        run: |
          docker run -d --name prueba -p 8765:8765 rumbo:prueba
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:8765/api/ping && break; sleep 2; done
          curl -fs http://127.0.0.1:8765/api/ping | grep -q patrimonio
          codigo() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          echo "Sin llave no se ve nada"
          test "$(codigo http://127.0.0.1:8765/api/cartera)" = "403"
          test "$(codigo http://127.0.0.1:8765/)" = "403"
          echo "Con la llave del volumen, sí"
          LLAVE=$(docker exec prueba cat /data/.acceso)
          test "$(codigo -c galletas "http://127.0.0.1:8765/?acceso=$LLAVE")" = "302"
          test "$(codigo -b galletas http://127.0.0.1:8765/api/cartera)" = "200"
          test "$(codigo -b galletas http://127.0.0.1:8765/)" = "200"
          echo "Un dominio de internet no puede hacerse pasar por Rumbo"
          test "$(codigo -H 'Host: evil.com' http://127.0.0.1:8765/api/ping)" = "403"
          echo "No corre como administrador"
          test "$(docker exec prueba id -u)" = "1000"
          docker logs prueba

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Publicar para amd64 y arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
